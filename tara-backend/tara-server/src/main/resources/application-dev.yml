spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:tara_dev_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        jdbc:
          batch_size: 50

  flyway:
    enabled: false # In-memory dev mode uses Hibernate DDL auto

  data:
    redis:
      repositories:
        enabled: false

management:
  health:
    redis:
      enabled: false

