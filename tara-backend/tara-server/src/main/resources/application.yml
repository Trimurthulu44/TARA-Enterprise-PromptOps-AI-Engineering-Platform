server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: tara-platform
  profiles:
    active: dev

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tara_db}
    username: ${SPRING_DATASOURCE_USERNAME:tara_user}
    password: ${SPRING_DATASOURCE_PASSWORD:tara_secret_2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 50
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms

tara:
  jwt:
    secret: ${TARA_JWT_SECRET:EnterprisePromptOpsSecretKeyMustBeAtLeast256BitsLongForHMACSHA512Security}
    access-token-expiration-ms: 86400000 # 24 hours
    refresh-token-expiration-ms: 604800000 # 7 days
  ai-service:
    url: ${TARA_AI_SERVICE_URL:http://localhost:8090}
  rate-limit:
    requests-per-minute: 600

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
